<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hologramme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Écran de démarrage pour débloquer l'autoplay audio -->
    <div id="start-screen">
        <button id="start-btn">Démarrer l'hologramme</button>
    </div>

    <!-- Les 4 faces de la pyramide, chacune contient le même contenu tourné -->
    <div class="pyramid" style="display:none">
        <div class="face right">
            <div class="content">
                <video class="avatar" muted loop playsinline></video>
                <div class="overlay" id="overlay-right"></div>
            </div>
        </div>
        <div class="face bottom">
            <div class="content">
                <video class="avatar" muted loop playsinline></video>
                <div class="overlay" id="overlay-bottom"></div>
            </div>
        </div>
        <div class="face left">
            <div class="content">
                <video class="avatar" muted loop playsinline></video>
                <div class="overlay" id="overlay-left"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
